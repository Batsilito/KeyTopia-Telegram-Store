kind = "web"
previewPath = "/"
title = "KeyTopia Telegram Admin"
description = "A production operations dashboard for the isolated KeyTopia Telegram digital subscription store, covering orders, payments, products, inventory, support, promotions, wallet activity, and analytics."
version = "1.0.0"
id = "artifacts/keytopia-admin"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21997

[services.development]
run = "pnpm --filter @workspace/keytopia-admin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/keytopia-admin", "run", "build" ]
serve = "static"
publicDir = "artifacts/keytopia-admin/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21997"
BASE_PATH = "/"
